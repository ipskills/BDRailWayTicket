<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; padding: 16px; font-family: Arial, sans-serif; background: #1a1d24; color: #fff; }
    h2 { margin: 0 0 12px 0; font-size: 16px; color: #3b82f6; }
    .profile { background: #252830; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .profile .label { color: #9ca3af; font-size: 11px; text-transform: uppercase; }
    .profile .value { font-size: 14px; font-weight: bold; margin: 2px 0 8px 0; }
    .btn { color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
    .btn-blue { background: #3b82f6; }
    .btn-blue:hover { background: #2563eb; }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }
    .btn-red { background: #ef4444; }
    .btn-red:hover { background: #dc2626; }
    .btn:disabled { background: #4b5563; cursor: not-allowed; }
    .status { font-size: 12px; color: #9ca3af; margin-top: 8px; text-align: center; }
    .error { color: #ef4444; }
    .success { color: #10b981; }
    .settings { background: #252830; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; }
    .settings label { color: #9ca3af; display: block; margin-bottom: 4px; }
    .settings input { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #4b5563; background: #1a1d24; color: #fff; margin-bottom: 8px; box-sizing: border-box; }
    .settings select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #4b5563; background: #1a1d24; color: #fff; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>
  <h2>BD Railway Auto Seat</h2>

  <div id="profile-section">
    <div class="status">Loading profile...</div>
  </div>

  <div class="settings">
    <label>Preferred Seats (comma-separated)</label>
    <input type="text" id="preferred" value="57,58">

    <div class="row">
      <div>
        <label>Seats to Book</label>
        <input type="number" id="numSeats" value="3" min="1" max="8">
      </div>
      <div>
        <label>Start Seat (sequential)</label>
        <input type="number" id="startSeat" value="59" min="1" max="60">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Mode</label>
        <select id="mode">
          <option value="priority">Priority</option>
          <option value="sequential">Sequential</option>
        </select>
      </div>
      <div>
        <label>Gauge</label>
        <select id="gauge">
          <option value="60">Meter (1-60)</option>
          <option value="100">Broad (1-100)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Click Mode</label>
        <select id="clickMode">
          <option value="burst">Micro-Burst</option>
          <option value="sequential">Sequential</option>
        </select>
      </div>
      <div>
        <label>Max Retry</label>
        <input type="number" id="maxRetry" value="5" min="1" max="20">
      </div>
    </div>
  </div>

  <button class="btn btn-green" id="startBtn">START - Auto Select Seats</button>

  <div id="result" style="display:none; background:#252830; padding:10px; border-radius:8px; margin-top:8px; font-size:12px;"></div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
